<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Go Explore — Add-Traveller</title>
    <link rel="stylesheet" href="../../css/traveller_edit.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
    <main class="wrap">
        <div class="traveller-edit-page">
            <div class="appbar-container">
                <div class="appbar">
                    <div class="appbar-row">
                        <button class="icon-btn back-btn">
                            <img src="../../assets/icons/backbutton.svg" alt="Back" />
                        </button>
                        <h2>Add Travellers</h2>
                        <div class="right-icons">
                            <img src="../../assets/icons/traveller.svg" alt="Mail Icon" class="right-img-traveller" />
                        </div>
                    </div>
                </div>
                <div class="svgbox">
                    <svg viewBox="0 0 800 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
                        <path d="M 0 0 Q 0 50 100 50 C 700 50 100 50 700 50 C 800 50 800 100 800 100 L 0 100 L 0 0 "
                            fill="#fff" />
                    </svg>
                </div>
            </div>
        </div>

        <section class="trip-summary">
            <h3>Washington New York and Boston</h3>
            <p>31 Aug 2022 Wednesday | 1 Room, 2 Guests | Standard</p>
        </section>

        <section class="traveller-section">
            <div class="section-header">
                <h4>Adult 1 <span>(12+ yrs)</span></h4>
                <h5>+ Saved Travellers <span>-</span></h5>
            </div>

            <!-- Edit mode -->
            <div class="traveller-edit-card">
                <div class="traveller-gender-box">
                    <div class="traveller-gender">
                        <img src="../../assets/icons/traveller_male.svg" alt="traveller" />
                        <p class="gender">Mr.</p>
                    </div>
                    <div class="traveller-gender">
                        <img src="../../assets/icons/ms.svg" alt="traveller" />
                        <p class="gender">Mrs.</p>
                    </div>
                    <div class="traveller-gender">
                        <img src="../../assets/icons/traveller_male.svg" alt="traveller" />
                        <p class="gender">Ms.</p>
                    </div>
                    <div class="traveller-gender">
                        <img src="../../assets/icons/ms.svg" alt="traveller" />
                        <p class="gender">Mx.</p>
                    </div>
                </div>

                <div class="modify-input-group">
                    <div class="left-column">
                        <label class="search-label" for="from">First Name</label>
                        <input type="text" id="destination" placeholder="Neha" />
                    </div>
                </div>

                <div class="modify-input-group">
                    <div class="left-column">
                        <label class="search-label" for="from">Last Name</label>
                        <input type="text" id="destination" placeholder="Negi" />
                    </div>
                </div>

                <div class="modify-input-group">
                    <div class="left-column">
                        <label class="search-label" for="from">Date of Birth</label>
                        <input type="text" id="destination" placeholder="10 Jun 1996" />
                    </div>
                    <img src="../../assets/icons/calender.svg" alt="calendar" class="calender-icon" />
                </div>
            </div>
        </section>

        <section class="traveller-section">
            <div class="section-header">
                <h4>Adult 1 <span>(12+ yrs)</span></h4>
                <h5>+ Saved Travellers <span>-</span></h5>
            </div>

            <!-- Edit mode -->
            <div class="traveller-edit-card">
                <div class="traveller-gender-box">
                    <div class="traveller-gender">
                        <img src="../../assets/icons/traveller_male.svg" alt="traveller" />
                        <p class="gender">Mr.</p>
                    </div>
                    <div class="traveller-gender">
                        <img src="../../assets/icons/ms.svg" alt="traveller" />
                        <p class="gender">Mrs.</p>
                    </div>
                    <div class="traveller-gender">
                        <img src="../../assets/icons/traveller_male.svg" alt="traveller" />
                        <p class="gender">Ms.</p>
                    </div>
                    <div class="traveller-gender">
                        <img src="../../assets/icons/ms.svg" alt="traveller" />
                        <p class="gender">Mx.</p>
                    </div>
                </div>

                <div class="modify-input-group">
                    <div class="left-column">
                        <label class="search-label" for="from">First Name</label>
                        <input type="text" id="destination" placeholder="Neha" />
                    </div>
                </div>

                <div class="modify-input-group">
                    <div class="left-column">
                        <label class="search-label" for="from">Last Name</label>
                        <input type="text" id="destination" placeholder="Negi" />
                    </div>
                </div>

                <div class="modify-input-group">
                    <div class="left-column">
                        <label class="search-label" for="from">Date of Birth</label>
                        <input type="text" id="destination" placeholder="10 Jun 1996" />
                    </div>
                    <img src="../../assets/icons/calender.svg" alt="calendar" class="calender-icon" />
                </div>
            </div>
        </section>

        <!-- Bottom Nav Bar -->
        <div class="bottom-bar-button">
            <button class="continue-btn" id="doneBtn">Done</button>
        </div>

    </main>


    <script src="traveller_edit.js"></script>
    <script src="../../global/js/main.js"></script>

</body>

</html>
