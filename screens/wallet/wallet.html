<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Go Explore — Wallets</title>
    <link rel="stylesheet" href="../../css/wallet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
    <main class="wrap">
        <div class="wallet-page">
            <div class="appbar-container">
                <div class="appbar">
                    <div class="appbar-row">
                        <button class="icon-btn back-btn">
                            <img src="../../assets/icons/backbutton.svg" alt="Back" />
                        </button>
                        <h2>Wallets</h2>
                    </div>
                </div>
                <div class="svgbox">
                    <svg viewBox="0 0 800 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
                        <path d="M 0 0 Q 0 50 100 50 C 700 50 100 50 700 50 C 800 50 800 100 800 100 L 0 100 L 0 0 "
                            fill="#fff" />
                    </svg>
                </div>
            </div>
        </div>

        <div class="wallet-content">
            <div class="wallet-box">
                <div class="payment-card">
                    <div class="left">
                        <div class="left-icon">
                            <img src="../../assets/icons/mobikwik.png" class="pay-icon">
                        </div>
                        <div class="pay-texts">
                            <div class="title">Mobikwik</div>
                            <div class="subtitle">Link your Mobikwik wallet</div>
                        </div>
                    </div>
                    <div class="right">
                        <div class="radio-group">
                            <label class="custom-radio">
                                <input type="radio" name="duration" />
                                <span class="radio-check"></span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="payment-card">
                    <div class="left">
                        <div class="left-icon">
                            <img src="../../assets/icons/amazone.png" class="pay-icon">
                        </div>
                        <div class="pay-texts">
                            <div class="title">Amazon Pay</div>
                            <div class="subtitle">Link your Amazon pay wallet</div>
                        </div>
                    </div>
                    <div class="right">
                        <div class="radio-group">
                            <label class="custom-radio">
                                <input type="radio" name="duration" />
                                <span class="radio-check"></span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="convinient-fee-section">
                <img src="../../assets/icons/infoIcon.png" alt="discount" />
                <span>Non-refundable Convenience Fee of <span class="rupee"> ₹</span>100 applied</span>
            </div>
        </div>

        <!-- Bottom Nav Bar -->
        <div class="bottom-bar">
            <div class="left-section">
                <div class="guest-info">
                    <p class="guest-count">02 Guests</p>
                    <div class="price-row">
                        <span class="price"><span class="rupee">₹</span>3,24,654</span>
                        <i class="fa-solid fa-angle-up"></i>
                    </div>
                    <div class="deal-applied">
                        <img src="../../assets/icons/percentage.png" alt="discount" />
                        <span>Deal Applied</span>
                    </div>
                </div>
            </div>

            <div class="right-section">
                <button class="continue-btn"
                    onclick="window.location.href='../booking_confirmed/booking_confirmed.html'">CONTINUE</button>
            </div>
        </div>
    </main>



    <script src="wallet.js"></script>
    <script src="../../global/js/main.js"></script>

</body>

</html>
