<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Go Explore — Payment-Successful</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
    <main class="wrap">

        <div class="booking-confirmed-background">
            <div class="success-header">
                <div class="success-text">
                    <h2>PAYMENT SUCCESSFUL</h2>
                    <p class="amount"><span class="rupee">₹</span>3,24,654</p>
                </div>
                <img src="../assets/icons/bookingConfirmed.png" class="success-icon" alt="Success">
            </div>

            <div class="booking-confirmed-content">
                <div class="recieve-payment-card">
                    <h3>We have received your payment.</h3>

                    <p class="ref-label">Reference No :</p>
                    <p class="ref-number">78993839389</p>

                    <button class="continue-btn">MY BOOKINGS</button>
                </div>
            </div>
        </div>
    </main>


    <script src="../js/components.js"></script>
    <script src="../js/home.js"></script>
    <script src="../js/main.js"></script>

</body>

</html>
