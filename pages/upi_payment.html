<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Go Explore — UPI-Payment</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
    <main class="wrap">
        <div class="traveller-details-page">
            <div class="appbar-container">
                <div class="appbar">
                    <div class="appbar-row">
                        <button class="icon-btn back-btn">
                            <img src="../assets/icons/backbutton.svg" alt="Back" />
                        </button>
                        <h2>UPI Payment</h2>
                    </div>
                </div>
                <div class="svgbox">
                    <svg viewBox="0 0 800 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
                        <path d="M 0 0 Q 0 50 100 50 C 700 50 100 50 700 50 C 800 50 800 100 800 100 L 0 100 L 0 0 "
                            fill="#fff" />
                    </svg>
                </div>
            </div>
        </div>

        <div class="upi-content">
            <div class="payment-section">
                <h3 class="title">Pay using Apps</h3>
                <p class="subtitle">You will be redirected to your UPI app</p>

                <div class="app-card">
                    <div class="left">
                        <div class="left-icon">
                            <img src="../assets/icons/paytm.png" alt="Paytm">
                        </div>
                        <span>PayTM</span>
                    </div>
                    <div class="radio-group">
                        <label class="custom-radio">
                            <input type="radio" name="duration" />
                            <span class="radio-check"></span>
                        </label>
                    </div>
                </div>

                <div class="app-card">
                    <div class="left">
                        <div class="left-icon">
                            <img src="../assets/icons/phonePay.png" alt="Paytm">
                        </div>
                        <span>Phone Pe</span>
                    </div>
                    <div class="radio-group">
                        <label class="custom-radio">
                            <input type="radio" name="duration" />
                            <span class="radio-check"></span>
                        </label>
                    </div>
                </div>

                <div class="app-card">
                    <div class="left">
                        <div class="left-icon">
                            <img src="../assets/icons/gpay.png" alt="Paytm">
                        </div>
                        <span>Google Pay</span>
                    </div>
                    <div class="radio-group">
                        <label class="custom-radio">
                            <input type="radio" name="duration" />
                            <span class="radio-check"></span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="payment-section">
                <div class="title-row">
                    <h3 class="title">Pay using UPI ID</h3>

                    <div class="upi-header">
                        <img src="../assets/icons/paytm.png">
                        <img src="../assets/icons/phonePay.png">
                        <img src="../assets/icons/gpay.png">
                    </div>
                </div>
                <p class="subtitle">You will receive a payment request</p>

                <div class="input-box">
                    <img src="../assets/icons/upi.png" class="input-icon">
                    <input type="text" placeholder="Enter UPI ID">
                </div>
            </div>

            <div class="payment-section">
                <h3 class="title">Pay using Phone Number</h3>
                <p class="subtitle">You will receive a payment request</p>

                <div class="input-box">
                    <img src="../assets/icons/gpay.png" class="input-icon">
                    <input type="text" placeholder="Google Pay phone number">
                </div>
            </div>
        </div>

        <!-- Bottom Nav Bar -->
        <div class="bottom-bar">
            <div class="left-section">
                <div class="guest-info">
                    <p class="guest-count">02 Guests</p>
                    <div class="price-row">
                        <span class="price"><span class="rupee">₹</span>3,24,654</span>
                        <i class="fa-solid fa-angle-up"></i>
                    </div>
                    <div class="deal-applied">
                        <img src="../assets/icons/percentage.png" alt="discount" />
                        <span>Deal Applied</span>
                    </div>
                </div>
            </div>

            <div class="right-section">
                <button class="continue-btn">CONTINUE</button>
            </div>
        </div>
    </main>


    <script src="../js/components.js"></script>
    <script src="../js/home.js"></script>
    <script src="../js/main.js"></script>

</body>

</html>
